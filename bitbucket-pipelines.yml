image: mcr.microsoft.com/playwright:v1.50.0-jammy

pipelines:
  default:
    - parallel:
        - step:
            name: Playwright E2E - Shard 1/2
            caches:
              - node
            script:
              - npm ci || npm install
              - npx playwright install chromium
              - npx playwright test --shard=1/2
            artifacts:
              - playwright-report/**
              - test-results/**
        - step:
            name: Playwright E2E - Shard 2/2
            caches:
              - node
            script:
              - npm ci || npm install
              - npx playwright install chromium
              - npx playwright test --shard=2/2
            artifacts:
              - playwright-report/**
              - test-results/**
